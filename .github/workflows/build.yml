name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: stpg-command-center-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: cd build/ios/iphoneos && mkdir Payload && cp -r Runner.app Payload/ && zip -qr stpg-command-center-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: stpg-command-center-ios-unsigned
          path: build/ios/iphoneos/stpg-command-center-unsigned.ipa
