name: build

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Build settings. Secrets/variables are set in GitHub → Settings → Secrets and variables → Actions.
# Everything is optional: missing values just switch the related feature off (see docs/SETUP.md).
env:
  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
  FIREBASE_DEFINES: >-
    --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }}
    --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
    --dart-define=FIREBASE_SENDER_ID=${{ vars.FIREBASE_SENDER_ID }}
    --dart-define=FIREBASE_ANDROID_APP_ID=${{ vars.FIREBASE_ANDROID_APP_ID }}
    --dart-define=FIREBASE_IOS_APP_ID=${{ vars.FIREBASE_IOS_APP_ID }}
    --dart-define=FIREBASE_IOS_BUNDLE_ID=${{ vars.FIREBASE_IOS_BUNDLE_ID }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze (errors and warnings fail the build)
        run: |
          dart analyze --format=machine > analyze.txt 2>&1 || true
          awk -F'|' '$1=="ERROR"||$1=="WARNING"{print "::error file="$4",line="$5"::"$3" "$8}' analyze.txt
          ! grep -qE '^(ERROR|WARNING)\|' analyze.txt
      - name: Release keystore (only when the signing secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "STPG_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          STPG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STPG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STPG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --dart-define=GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY $FIREBASE_DEFINES
      - uses: actions/upload-artifact@v4
        with:
          name: stpg-command-center-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: /usr/libexec/PlistBuddy -c "Set :GMSApiKey $GOOGLE_MAPS_API_KEY" ios/Runner/Info.plist
      - run: flutter build ios --release --no-codesign --dart-define=GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY $FIREBASE_DEFINES
      - run: cd build/ios/iphoneos && mkdir Payload && cp -r Runner.app Payload/ && zip -qr stpg-command-center-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: stpg-command-center-ios-unsigned
          path: build/ios/iphoneos/stpg-command-center-unsigned.ipa

  web:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # The web app is public, so it is built WITHOUT the Google Maps key
      # (it uses OpenStreetMap/Esri tiles and free OSRM routing instead).
      - run: flutter build web --release --base-href /stpg-command-center-flutter/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4
