<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="STPG Raptor Command Center">
  <meta name="theme-color" content="#070A0F">
  <!-- iPhone "Add to Home Screen" -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="STPG">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>STPG Command Center</title>
  <style>
    html, body { margin: 0; height: 100%; background: #070A0F; }
    #stpg-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; font: 900 14px/1.6 system-ui, sans-serif; letter-spacing: 3px; color: #4CAF50; }
    #stpg-loading b { color: #FF6A00; font-size: 32px; letter-spacing: 8px; font-style: italic; }
  </style>
</head>
<body>
  <div id="stpg-loading"><b>STPG</b>INITIALIZING COMMAND SYSTEM...</div>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('stpg-loading')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
